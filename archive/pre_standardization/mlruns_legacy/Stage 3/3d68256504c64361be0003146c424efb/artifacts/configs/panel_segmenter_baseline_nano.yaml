  hsv_s: 0.4
  hsv_v: 0.4
  degrees: 10.0
  scale: 0.3
  perspective: 0.0005
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  erasing: 0.0
  close_mosaic: 0
