task: segment

differential_lr: false

model_preset: yolo26n-seg.pt

project_name: stage3_panel_segmenter_baseline
run_name: stage3_panel_segmenter_baseline

multi_scale: false

dataset_config: "data/processed/stage3/car_damages_panel/car_damages_panel.yaml"

epochs: 100
imgsz: 640
batch_size: 8
patience: 20
device: 0
workers: 8
amp: true
freeze: 0

