preset: safety

model_type: yolov8
model_path: backend/models/stage2/deployed.pt
device: mps # auto | cuda | mps | cpu

model_registry:
  objectness_branch_new: runs/segment/seesaw_surgical_objectness-26/weights/best.pt
  baseline_m5: runs/segment/stage1_head_warmup_7cls_extended/stage1_head_warmup_7cls_extended/weights/best.pt
  surgical_early: runs/segment/seesaw_surgical_early/weights/best.pt
  model_4: runs/segment/model5_resume_adapt_7cls/stage2_differential_finetune_7cls/weights/best.pt

sahi:
  slice_size: 1024      # MUST match training resolution (Native Resolution Rule)
  overlap_ratio: 0.15  # derived from O_min >= w / (2P)

nms:
  ios_threshold: 0.50  # mask Intersection-over-Smaller (thin-defect safe)

routing_strategy:
  balanced:
    models: [objectness_branch_new]
    merge: none
  # LIVE-CALIBRATED on M5 (Phase 4F): per_class routing, FPR 54.0% / Recall 92.9%. See docs/reports/phase4_safety_calibration.md
  safety:
    models: [objectness_branch_new, baseline_m5]
    merge: per_class
    class_routing:
      corrosion: objectness_branch_new
      disjoint_part: objectness_branch_new
      glass_shatter: objectness_branch_new
      # broken_lamp, crack, dent, scratch: undesignated → both models contribute
  max_recall:
    models: [objectness_branch_new, baseline_m5, surgical_early, model_4]
    merge: union
  specialist:
    models: [objectness_branch_new, baseline_m5]
    merge: per_class
    class_routing:
      corrosion: objectness_branch_new
      disjoint_part: objectness_branch_new
      glass_shatter: objectness_branch_new
      broken_lamp: baseline_m5
      crack: baseline_m5
      dent: baseline_m5
      scratch: baseline_m5

two_tier_gating:
  enabled: true
  applies_to: objectness_branch_new
  # Fallback defaults — presets override these in their own two_tier_gating block
  obj_threshold: 0.20
  cls_threshold: 0.25

presets:
  balanced:   # ~1 false alarm per suspect car. Avoids operator alarm fatigue.
    class_rules:
      "0": { conf: 0.25, min_area: 0 }
      "1": { conf: 0.25, min_area: 0 }
      "2": { conf: 0.25, min_area: 0 }
      "3": { conf: 0.25, min_area: 0 }
      "4": { conf: 0.25, min_area: 0 }
      "5": { conf: 0.15, min_area: 30 }    # corrosion
      "6": { conf: 0.15, min_area: 200 }   # disjoint_part
    two_tier_gating:
      obj_threshold: 0.35
      cls_threshold: 0.35
  safety:     # ~4 false alarms per suspect car. Recall-first for critical shifts.
    class_rules:
      "0": { conf: 0.25, min_area: 0 }
      "1": { conf: 0.25, min_area: 0 }
      "2": { conf: 0.25, min_area: 0 }
      "3": { conf: 0.25, min_area: 0 }
      "4": { conf: 0.25, min_area: 0 }
      "5": { conf: 0.10, min_area: 30 }
      "6": { conf: 0.10, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.20
      cls_threshold: 0.25
  max_recall: # ~10 false alarms per suspect car. Maximum coverage.
    class_rules:
      "0": { conf: 0.25, min_area: 0 }
      "1": { conf: 0.25, min_area: 0 }
      "2": { conf: 0.25, min_area: 0 }
      "3": { conf: 0.25, min_area: 0 }
      "4": { conf: 0.25, min_area: 0 }
      "5": { conf: 0.05, min_area: 30 }
      "6": { conf: 0.05, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.10
      cls_threshold: 0.25
  calib:      # threshold-sweep only, never ship to production
    class_rules:
      "0": { conf: 0.25, min_area: 0 }
      "1": { conf: 0.25, min_area: 0 }
      "2": { conf: 0.25, min_area: 0 }
      "3": { conf: 0.25, min_area: 0 }
      "4": { conf: 0.25, min_area: 0 }
      "5": { conf: 0.05, min_area: 30 }
      "6": { conf: 0.05, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.01
      cls_threshold: 0.01
