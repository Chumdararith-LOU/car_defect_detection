task: segment
loss_type: bce
model_preset: model5_resume_adapt/model1_remapped_7class_init.pt

# Surgical Fine-Tuning: early_texture (layers 0-4 + head unfrozen, layers 5-22 frozen)
# This isolates texture extraction (early backbone) while preserving deep geometry
surgical_mode: early_texture

project_name: car_defect_detection
run_name: seesaw_surgical_texture_refined
multi_scale: false

dataset_config: "data/processed/yolo_seg/data.yaml"
epochs: 25
imgsz: 1024
batch_size: 4
nbs: 64
patience: 10
device: 0
workers: 8
amp: true

freeze: 23
optimizer: AdamW
lr0: 0.0005
lrf: 0.01

augmentations:
  hsv_h: 0.03
  hsv_s: 0.4
  hsv_v: 0.5
  degrees: 15.0
  scale: 0.2
  perspective: 0.0005
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  erasing: 0.2
  close_mosaic: 10
