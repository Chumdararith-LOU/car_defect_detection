# Production inference configuration for the car-defect inference API.
# Model weights are resolved by NAME via models/manifest.json (model registry);
# this file defines tiling, NMS, routing, gating, and per-preset acceptance rules.

sahi:
  slice_size: 1024      # MUST match training resolution (Native Resolution Rule)
  overlap_ratio: 0.15   # derived from O_min >= w_max / (2P)

nms:
  ios_threshold: 0.50   # mask Intersection-over-Smaller (thin-defect safe)

# Two-tier objectness gating defaults (presets override these).
two_tier_gating:
  enabled: true
  applies_to: objectness_branch_new
  obj_threshold: 0.20
  cls_threshold: 0.25

# Which models run per preset and how their outputs merge.
routing_strategy:
  balanced:
    models: [objectness_branch_new]
    merge: none
  safety:
    models: [objectness_branch_new, baseline_m5]
    merge: per_class
    class_routing:
      corrosion: objectness_branch_new
      glass_shatter: objectness_branch_new
      broken_part: baseline_m5
      disjoint_part: baseline_m5
  max_recall:
    models: [objectness_branch_new, baseline_m5, surgical_early, model_4]
    merge: union
  specialist:
    models: [objectness_branch_new, baseline_m5]
    merge: per_class
    class_routing:
      corrosion: objectness_branch_new
      disjoint_part: baseline_m5
      glass_shatter: objectness_branch_new
      broken_part: baseline_m5
      crack: baseline_m5
      dent: baseline_m5
      scratch: baseline_m5

# Per-preset acceptance rules and gating thresholds.
presets:
  balanced:   # ~1 false alarm per suspect car
    class_rules:
      default: { conf: 0.25, min_area: 0 }
      dent: { conf: 0.25, min_area: 0 }
      scratch: { conf: 0.25, min_area: 0 }
      crack: { conf: 0.25, min_area: 0 }
      glass_shatter: { conf: 0.25, min_area: 0 }
      broken_part: { conf: 0.25, min_area: 0 }
      corrosion: { conf: 0.15, min_area: 30 }
      disjoint_part: { conf: 0.15, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.35
      cls_threshold: 0.35

  safety:     # ~4 false alarms per suspect car (production default)
    class_rules:
      default: { conf: 0.25, min_area: 0 }
      dent: { conf: 0.25, min_area: 0 }
      scratch: { conf: 0.25, min_area: 0 }
      crack: { conf: 0.25, min_area: 0 }
      glass_shatter: { conf: 0.25, min_area: 0 }
      broken_part: { conf: 0.25, min_area: 0 }
      corrosion: { conf: 0.10, min_area: 30 }
      disjoint_part: { conf: 0.25, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.20
      cls_threshold: 0.25

  max_recall: # ~10 false alarms per suspect car
    class_rules:
      default: { conf: 0.25, min_area: 0 }
      dent: { conf: 0.25, min_area: 0 }
      scratch: { conf: 0.25, min_area: 0 }
      crack: { conf: 0.25, min_area: 0 }
      glass_shatter: { conf: 0.25, min_area: 0 }
      broken_part: { conf: 0.25, min_area: 0 }
      corrosion: { conf: 0.05, min_area: 30 }
      disjoint_part: { conf: 0.05, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.10
      cls_threshold: 0.25

  specialist: # full per-class routing (safety thresholds)
    class_rules:
      default: { conf: 0.25, min_area: 0 }
      dent: { conf: 0.25, min_area: 0 }
      scratch: { conf: 0.25, min_area: 0 }
      crack: { conf: 0.25, min_area: 0 }
      glass_shatter: { conf: 0.25, min_area: 0 }
      broken_part: { conf: 0.25, min_area: 0 }
      corrosion: { conf: 0.10, min_area: 30 }
      disjoint_part: { conf: 0.25, min_area: 200 }
    two_tier_gating:
      obj_threshold: 0.20
      cls_threshold: 0.25
